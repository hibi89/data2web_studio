name: DATA2WEB R29 High actual browser saved HTML security replay
on:
  push:
    branches:
      - "work/high-data2web-security-r06-r29-20261115"
    paths:
      - "browser_r29_saved_dom_probe.py"
      - "r29_html_surface_policy.py"
      - ".github/workflows/r29-high-browser-saved-dom.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r29-saved-dom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-file-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only pinned browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real browser save/reopen, R29 strict HTML surface guard
        run: python browser_r29_saved_dom_probe.py --channel chromium
  windows-file-only:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned test-only harness
        run: python -m pip install playwright==1.56.0
      - name: Installed Chrome HTML save/reopen
        run: python browser_r29_saved_dom_probe.py --channel chrome
      - name: Installed Edge HTML save/reopen
        run: python browser_r29_saved_dom_probe.py --channel msedge
