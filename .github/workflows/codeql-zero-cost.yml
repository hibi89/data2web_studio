name: DATA2WEB zero-cost public-source CodeQL
on:
  push:
    branches: ["feature/final-blueprint-p85-evidence-20261113"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: data2web-zero-cost-codeql
  cancel-in-progress: true
jobs:
  python-source-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public source only (no customer files)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize free CodeQL Python static analysis
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze public source and publish security findings
        uses: github/codeql-action/analyze@v4
