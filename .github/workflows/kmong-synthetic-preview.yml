name: DATA2WEB zero-cost synthetic Kmong preview
on:
  push:
    branches: ["feature/final-blueprint-p85-evidence-20261113"]
    paths:
      - "kmong_weekend_demo.py"
      - "kmong_preview_screenshot.py"
      - "kmong_registration_kit.py"
      - "kmong_independent_buyer_request.py"
      - "test_kmong_independent_buyer_request.py"
      - "test_kmong_registration_kit.py"
      - "docs/KMONG_WEEKEND_REGISTRATION_READY_20261114.md"
      - "docs/KMONG_WEEKEND_LISTING_20261114.md"
      - "docs/OWNER_APPROVAL_PACKET_A_20261114.md"
      - "docs/OWNER_ACTIONS_1300_KST_20261114.md"
      - "docs/ZERO_COST_OWNER_AUTHORIZATION_20261114.md"
      - "docs/KMONG_LOCAL_PREORDER_TRIAGE_20261114.md"
      - "docs/R22_ZIP_STRICT_CSP_INTEGRITY_20261114.md"
      - "test_kmong_weekend_demo.py"
      - ".github/workflows/kmong-synthetic-preview.yml"
      - "data2web.py"
      - "data2web_append.py"
      - "data2web_tabular.py"
      - "path_policy.py"
      - "receipt_utils.py"
      - "verify_delivery.py"
      - "data2web_single.py"
      - "verify_customer_folder.py"
      - "delivery.py"
      - "data2web_web.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-product-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic-only no-clobber and deterministic package tests
        run: python -m unittest test_kmong_weekend_demo -v
      - name: R06 real source and output FD identity checks
        run: python -m unittest test_xlsx_inspection_snapshot test_output_snapshot_security -v
      - name: Make and independently verify artificial demonstration package
        run: python kmong_weekend_demo.py --output ./kmong-preview-synthetic
      - name: Install free Chromium for genuine synthetic UI screenshots
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture actual rendered local dashboard and filtered view
        run: python kmong_preview_screenshot.py --root ./kmong-preview-synthetic
      - name: Regression-test create-only registration kit builder
        run: python -m unittest test_kmong_registration_kit -v
      - name: Build canonical seller ZIP from real synthetic Chromium screenshots
        run: python kmong_registration_kit.py --preview ./kmong-preview-synthetic --output ./kmong-registration-ready.zip --source-sha "$GITHUB_SHA"
      - name: Regression-test no-customer-source independent device test REQUEST
        run: python -m unittest test_kmong_independent_buyer_request -v
      - name: Prepare independent buyer device testing ZIP, never claim acceptance
        run: python kmong_independent_buyer_request.py --preview ./kmong-preview-synthetic --output ./independent-buyer-test-request.zip --source-sha "$GITHUB_SHA"
      - name: Recheck score and zero-cost policy (never auto-approve sale)
        run: |
          python blueprint_score.py
          python zero_cost_gate.py
      - name: Upload ONLY synthetic preview files for owner listing review
        uses: actions/upload-artifact@v4
        with:
          name: DATA2WEB-KMONG-SYNTHETIC-DEMO
          path: kmong-preview-synthetic/
          if-no-files-found: error
          retention-days: 7
      - name: Upload zero-customer-data seller registration ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DATA2WEB-KMONG-REGISTRATION-KIT
          path: kmong-registration-ready.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload only synthetic independent buyer TEST REQUEST (not result)
        uses: actions/upload-artifact@v4
        with:
          name: DATA2WEB-SYNTHETIC-INDEPENDENT-BUYER-TEST-REQUEST
          path: independent-buyer-test-request.zip
          if-no-files-found: error
          retention-days: 7
