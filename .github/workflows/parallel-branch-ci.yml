name: DATA2WEB parallel branch safe technical CI
on:
  push:
    branches:
      - "work/high-data2web-security-r06-r29-20261115"
      - "work/codex-data2web-to100-20261115"
    paths:
      - "**/*.py"
      - "data/*.json"
      - "data/**/*.json"
      - "*.cmd"
      - "*.bat"
      - "*.sh"
      - "requirements*.txt"
      - ".github/workflows/parallel-branch-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data2web-parallel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Keep macOS temp root on real path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$PWD/.ci-real-temp"
          chmod 700 "$PWD/.ci-real-temp"
          echo "TMPDIR=$(cd .ci-real-temp && pwd -P)" >> "$GITHUB_ENV"
      - name: Full baseline technical regressions (synthetic only)
        run: python -m unittest discover -v
      - name: Check approved zero-cost operation
        run: python zero_cost_gate.py
      - name: Ensure source provenance matches exactly (never bypass on drift)
        run: python r21_source_provenance.py
      - name: Check synthetic shipping integrity (HOLD remains valid)
        run: python shipping_rights_preflight.py
      - name: Fixed 100-point score state (no bonus from CI)
        run: python blueprint_score.py
  chromium-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned test-only dependencies and Chromium
        run: |
          python -m pip install playwright==1.56.0 pypdf==5.9.0
          python -m playwright install --with-deps chromium
      - name: Local file dashboard/ZIP/receipt Chromium smoke (synthetic only)
        run: |
          python browser_p85_probe.py --channel chromium
          python browser_single_delivery_probe.py --channel chromium
  windows-offline-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned browser test-only dependencies
        run: python -m pip install playwright==1.56.0 pypdf==5.9.0
      - name: Installed Chrome smoke (file-only)
        run: python browser_p85_probe.py --channel chrome
      - name: Installed Edge smoke (file-only)
        run: python browser_p85_probe.py --channel msedge
